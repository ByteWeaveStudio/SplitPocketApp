[project]
name = "splitpocket-api"
version = "0.1.0"
description = "SplitPocket backend API — expense splitting and settlement logic on top of Supabase"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.9.1",
    "pytest>=8.4",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
